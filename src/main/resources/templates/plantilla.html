<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="es">

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Deco Plants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

    <nav th:fragment="navbar-admin" class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-shield-lock me-2"></i>Panel de Operaciones</span>
            
            <div class="d-flex align-items-center" sec:authorize="isAuthenticated()">
                <a th:href="@{/admin/pedidos}" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-cart-check me-1"></i> Pedidos
                </a>
                
                <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/productos/lista}" class="btn btn-outline-light btn-sm me-2">
                    <i class="bi bi-list-check me-1"></i> Inventario
                </a>
                
                <a th:href="@{/admin/incidencias}" class="btn btn-outline-warning btn-sm me-3">
                    <i class="bi bi-headset me-1"></i> Soporte
                </a>
                
                <span class="text-white me-3 small border-start ps-3">
                    <i class="bi bi-person-circle text-success me-1"></i> 
                    Hola, <strong sec:authentication="name">Usuario</strong>
                </span>

                <form th:action="@{/logout}" method="POST" class="m-0">
                    <button type="submit" class="btn btn-danger btn-sm">Salir <i class="bi bi-box-arrow-right"></i></button>
                </form>
            </div>
            
        </div>
    </nav>

    <div th:fragment="scripts">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </div>

</body>
</html>
