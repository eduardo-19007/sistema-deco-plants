<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{plantilla :: head('Error en el Sistema - Deco Plants')}"></head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7 mt-5 text-center">
                <div class="card shadow border-0 p-5 rounded-3">
                    <div class="card-body">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 5rem;"></i>
                        <h2 class="fw-bold text-dark mt-3">¡Ups! Algo salió mal</h2>
                        
                        <p class="text-secondary mt-3" th:text="${errorMsg}">Mensaje informativo del error</p>
                        
                        <div class="alert alert-secondary text-start p-3 rounded bg-light border-0">
                            <small class="text-muted fw-bold d-block mb-1">Causa técnica:</small>
                            <code class="text-danger small text-break" th:text="${detalle}">Exception details...</code>
                        </div>

                        <div class="d-flex justify-content-center gap-3 mt-4">
                            <a href="/" class="btn btn-success px-4"><i class="bi bi-house-door me-1"></i> Ir al Inicio</a>
                            <button onclick="window.history.back();" class="btn btn-outline-secondary px-4"><i class="bi bi-arrow-left me-1"></i> Regresar</button>
                        </div>
                    </div>
                </div>
                <p class="text-muted mt-4 small">Deco Plants S.A.C - Panel de Soporte Técnico</p>
            </div>
        </div>
    </div>

    <div th:replace="~{plantilla :: scripts}"></div>
</body>
</html>
