<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario - Deco Plants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-shield-lock me-2"></i>Panel de Administración</span>
            <div class="d-flex">
                <form th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-light btn-sm" type="submit">Cerrar Sesión</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-dark text-white py-3 d-flex justify-content-between align-items-center">
                <h4 class="mb-0"><i class="bi bi-list-check me-2"></i>Inventario de Productos</h4>
                <a th:href="@{/admin/productos/nuevo}" class="btn btn-success btn-sm">
                    <i class="bi bi-plus-circle me-1"></i> Nuevo Producto
                </a>
            </div>
            
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped mb-0 align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>ID</th>
                                <th>Nombre del Producto</th>
                                <th>Categoría</th>
                                <th>Precio</th>
                                <th>Stock</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="prod : ${productos}">
                                <td th:text="${prod.idProducto}">1</td>
                                <td class="fw-bold" th:text="${prod.nombre}">Nombre Producto</td>
                                <td th:text="${prod.categoria.nombre}">Categoría</td>
                                <td th:text="'S/ ' + ${prod.precio}">S/ 0.00</td>
                                <td th:text="${prod.stock}">0</td>
                                <td>
                                    <span th:if="${prod.estado}" class="badge bg-success">Activo</span>
                                    <span th:unless="${prod.estado}" class="badge bg-danger">Inactivo</span>
                                </td>
                                <td class="text-center">
                                    <a th:href="@{/admin/productos/editar/{id}(id=${prod.idProducto})}" 
                                       class="btn btn-sm btn-outline-warning" title="Editar">
                                       <i class="bi bi-pencil"></i>
                                    </a>
                                    
                                    <a th:href="@{/admin/productos/eliminar/{id}(id=${prod.idProducto})}" 
                                       class="btn btn-sm btn-outline-danger" title="Eliminar"
                                       onclick="return confirm('¿Estás seguro de que deseas eliminar este producto?');">
                                       <i class="bi bi-trash"></i>
                                    </a>
                                </td>
                            </tr>
                            
                            <tr th:if="${#lists.isEmpty(productos)}">
                                <td colspan="7" class="text-center py-4 text-muted">
                                    <i class="bi bi-inbox fs-2 d-block mb-2"></i>
                                    No hay productos registrados en el inventario.
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
