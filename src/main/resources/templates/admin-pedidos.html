<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin - Deco Plants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container-fluid px-4">
            <a class="navbar-brand" href="#"><i class="bi bi-shield-lock me-2"></i>ADMINISTRACIÓN - PEDIDOS</a>
            
            <div class="d-flex align-items-center">
                <span class="text-white me-3 small"><i class="bi bi-person-circle me-1"></i> Hola, Admin</span>
                <form th:action="@{/logout}" method="POST" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Cerrar Sesión <i class="bi bi-box-arrow-right"></i></button>
                </form>
            </div>
        </div>

    <main class="container-fluid px-4 my-4">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-striped align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>Orden</th>
                                <th>Fecha</th>
                                <th>Cliente</th>
                                <th>Despacho</th>
                                <th>Estado Actual</th>
                                <th>Acción Operativa</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="pedido : ${pedidos}">
                                <td class="fw-bold" th:text="'#' + ${pedido.idPedido}">#1</td>
                                <td th:text="${#temporals.format(pedido.fechaPedido, 'dd/MM/yyyy HH:mm')}">Fecha</td>
                                <td>
                                    <div class="fw-semibold" th:text="${pedido.nombreCliente}"></div>
                                    <div class="small text-muted" th:text="${pedido.telefonoCliente}"></div>
                                </td>
                                <td>
                                    <span class="badge border border-secondary text-secondary" th:text="${pedido.modalidadEntrega}">Entrega</span>
                                </td>
                                
                                <td>
                                    <span class="badge bg-danger" th:if="${pedido.estado == 'Pendiente'}">Pendiente</span>
                                    <span class="badge bg-warning text-dark" th:if="${pedido.estado == 'En Preparacion'}">En Preparación</span>
                                    <span class="badge bg-info text-dark" th:if="${pedido.estado == 'En Ruta'}">En Ruta</span>
                                    <span class="badge bg-success" th:if="${pedido.estado == 'Entregado'}">Entregado</span>
                                </td>

                                <td>
                                    <form th:action="@{/admin/pedidos/actualizar-estado/{id}(id=${pedido.idPedido})}" method="POST" class="d-inline">
                                        
                                        <input type="hidden" name="nuevoEstado" value="En Preparacion" th:if="${pedido.estado == 'Pendiente'}">
                                        <button type="submit" class="btn btn-sm btn-warning" th:if="${pedido.estado == 'Pendiente'}">
                                            Iniciar Preparación
                                        </button>

                                        <input type="hidden" name="nuevoEstado" value="En Ruta" th:if="${pedido.estado == 'En Preparacion'}">
                                        <button type="submit" class="btn btn-sm btn-info" th:if="${pedido.estado == 'En Preparacion'}">
                                            Despachar a Ruta
                                        </button>

                                        <input type="hidden" name="nuevoEstado" value="Entregado" th:if="${pedido.estado == 'En Ruta'}">
                                        <button type="submit" class="btn btn-sm btn-success" th:if="${pedido.estado == 'En Ruta'}">
                                            Confirmar Entrega
                                        </button>
                                        
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
