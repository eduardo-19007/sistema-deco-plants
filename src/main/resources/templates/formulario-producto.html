<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Producto - Deco Plants</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1"><i class="bi bi-shield-lock me-2"></i>Panel de Administración</span>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-success text-white py-3">
                        <h4 class="mb-0"><i class="bi bi-box-seam me-2"></i>Registrar Nuevo Producto</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <form th:action="@{/admin/productos/guardar}" th:object="${producto}" method="POST">
                            <input type="hidden" th:field="*{idProducto}" />
                            <div class="row g-3">
                                
                                <div class="col-md-12">
                                    <label class="form-label fw-bold text-secondary">Nombre del Producto *</label>
                                    <input type="text" class="form-control" th:field="*{nombre}" 
                                           th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''">
                                    
                                    <div class="invalid-feedback fw-semibold" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label fw-bold text-secondary">Categoría *</label>
                                    <select class="form-select" th:field="*{categoria.idCategoria}"
                                            th:classappend="${#fields.hasErrors('categoria')} ? 'is-invalid' : ''">
                                        <option value="" selected>Seleccione una categoría...</option>
                                        <option th:each="cat : ${categorias}" th:value="${cat.idCategoria}" th:text="${cat.nombre}"></option>
                                    </select>
                                    <div class="invalid-feedback fw-semibold" th:if="${#fields.hasErrors('categoria')}" th:errors="*{categoria}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary">Precio (S/.) *</label>
                                    <input type="number" step="0.01" class="form-control" th:field="*{precio}"
                                           th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback fw-semibold" th:if="${#fields.hasErrors('precio')}" th:errors="*{precio}"></div>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary">Stock Inicial *</label>
                                    <input type="number" class="form-control" th:field="*{stock}"
                                           th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid' : ''">
                                    <div class="invalid-feedback fw-semibold" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label fw-bold text-secondary">Descripción</label>
                                    <textarea class="form-control" rows="3" th:field="*{descripcion}"></textarea>
                                </div>

                                <div class="col-md-12">
                                    <label class="form-label fw-bold text-secondary">Ruta de la Imagen</label>
                                    <input type="text" class="form-control" th:field="*{imagen}" placeholder="/img/ejemplo.jpg">
                                </div>

                            </div>

                            <hr class="my-4">

                            <div class="d-flex justify-content-end">
                                <a href="/admin/pedidos" class="btn btn-outline-secondary me-2">Cancelar y Volver</a>
                                <button type="submit" class="btn btn-success"><i class="bi bi-save me-1"></i> Guardar Producto en Catálogo</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
