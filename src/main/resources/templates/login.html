<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{plantilla :: head('Login - Deco Plants')}"></head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4 mt-5">
                
                <div class="card shadow border-0" style="border-radius: 15px;">
                    <div class="card-header bg-success text-white text-center py-4" style="border-radius: 15px 15px 0 0;">
                        <h3 class="mb-0"><i class="bi bi-flower1 me-2"></i>Deco Plants</h3>
                        <small>Acceso Administrativo</small>
                    </div>
                    
                    <div class="card-body p-4">
                        
                        <div th:if="${param.error}" class="alert alert-danger text-center small">
                            <i class="bi bi-exclamation-triangle-fill"></i> Usuario o contraseña incorrectos.
                        </div>
                        
                        <div th:if="${param.logout}" class="alert alert-info text-center small">
                            <i class="bi bi-info-circle-fill"></i> Has cerrado sesión correctamente.
                        </div>

                        <form th:action="@{/login}" method="POST">
                            
                            <div class="mb-3">
                                <label class="form-label text-secondary fw-semibold">Usuario</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                    
                                    <input type="text" class="form-control" name="username" placeholder="Ingresa tu usuario" required autofocus>
                                </div>
                            </div>
                            
                            <div class="mb-4">
                                <label class="form-label text-secondary fw-semibold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                    
                                    <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                                </div>
                            </div>
                            
                            <button type="submit" class="btn btn-success w-100 fw-bold">Ingresar al Sistema</button>
                        </form>
                        
                        <div class="text-center mt-3">
                            <a href="/" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> Volver a la Tienda</a>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{plantilla :: scripts}"></div>
</body>
</html>
