# =========================================================
# CONEXIÓN A SQL SERVER (Capa de Persistencia)
# =========================================================

# 'spring.datasource.url' es la Cadena de Conexión (Connection String).
# - jdbc:sqlserver://localhost : Indica que el motor de base de datos está en tu propia máquina.
# - instanceName=SQLEXPRESS : Apunta a la instancia gratuita de SQL Server.
# - databaseName=DecoPlantsDB : El nombre exacto de tu base de datos.
# - encrypt=true;trustServerCertificate=true : VITAL para conexiones locales. Le dice al driver 
#   que encripte los datos, pero que confíe en el certificado autofirmado de tu PC sin lanzar errores de SSL.
spring.datasource.url=jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=DecoPlantsDB;encrypt=true;trustServerCertificate=true

# Credenciales de autenticación del motor de base de datos.
# 'sa' (System Administrator) es el superusuario por defecto de SQL Server.
spring.datasource.username=sa
spring.datasource.password=123456

# Especifica la librería exacta (Driver) que Java debe usar para "hablar" el idioma de Microsoft SQL Server.
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =========================================================
# CONFIGURACIÓN DE JPA / HIBERNATE (El ORM)
# =========================================================

# 'ddl-auto=update' es una instrucción directa al motor de Hibernate.
# Le dice: "Lee mis clases de Java (@Entity). Si la tabla no existe en SQL Server, créala. 
# Si le agregué un nuevo atributo a la clase, agrega la columna a la tabla. PERO nunca borres los datos existentes".
spring.jpa.hibernate.ddl-auto=update

# 'show-sql=true' activa el modo de auditoría en la consola.
# Cada vez que Spring hace un SELECT, INSERT o UPDATE por detrás, lo imprimirá en la consola de tu IDE.
# Es una herramienta excelente para depurar (debug) y ver exactamente qué le está pidiendo el backend a la BD.
spring.jpa.show-sql=true

# El 'Dialect' es el traductor exacto. JPA es genérico, pero SQL Server tiene funciones específicas.
# Esto asegura que Hibernate genere sentencias (como el VARCHAR(MAX) o el IDENTITY) usando la sintaxis correcta de Microsoft.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# =========================================================
# CONFIGURACIÓN DE THYMELEAF (Motor de Plantillas)
# =========================================================

# Desactiva la memoria caché de las vistas HTML.
# En un entorno de desarrollo, esto permite que si cambias el color de un botón o un texto en tu HTML, 
# solo tengas que recargar el navegador para ver el cambio (Hot Reloading), sin necesidad de reiniciar todo el servidor Java.
spring.thymeleaf.cache=false

# =========================================================
# LÍMITES DE SUBIDA DE ARCHIVOS (Evita caída del servidor)
# =========================================================
# Límite máximo para un solo archivo (Ej. 2 Megabytes)
spring.servlet.multipart.max-file-size=2MB

# Límite máximo para el tamaño total de la solicitud completa
spring.servlet.multipart.max-request-size=2MB